[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-llm"
version = "0.1.0"
description = "Pluggable LLM provider package for Quorum"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
    # Pydantic AI consolidates per-provider parameter quirks (max_tokens vs
    # max_completion_tokens, GPT-5 Responses-API routing, reasoning-model
    # temperature restrictions).  Pinned to the v1.94 release line that
    # introduced OpenAIChatModel + AzureProvider as the canonical Azure path.
    # `pydantic-ai-slim` ships only the core; the openai/anthropic extras pull
    # in the per-provider SDK shims (we already depend on those directly).
    "pydantic-ai-slim[openai,anthropic]>=1.94.0,<2.0",
    # Pydantic Logfire — Pydantic AI's native observability layer.  Imported
    # but only emits spans when LOGFIRE_TOKEN is set (send_to_logfire=
    # 'if-token-present' is configured at FastAPI startup).  Bare logfire
    # package here (no [fastapi] extra) since this package doesn't run the
    # web framework — apps/api carries that extra.
    "logfire>=4.0,<5",
]

[project.optional-dependencies]
azure-mi = [
    "azure-identity>=1.15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["quorum_llm*"]
