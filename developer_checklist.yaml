# =============================================================================
# Quorum — Developer Checklist
# =============================================================================
# Used by AI agents (Claude Code, Codex) to track remaining build work.
# Agents should announce "Starting item X.Y" when beginning each item.
# Compatible with sage-agent-tempo for token/cost/audit reporting.
#
# Tags: backend, frontend, api, tests, docs, config, realtime, avatar, voice, infra
# =============================================================================

project: quorum
description: >
  Multi-agent coordination platform for real-world group problem-solving.
  Expo debut: Duke Tech Expo 2026. Post-expo target: DCRI clinical research.
  Stations = browser URLs. Projector = live dashboard carousel.
  AI roles coordinate via A2A; human contributions drive quorum health score.

agent_instructions:
  language: TypeScript (frontend), Python 3.11 (backend)
  frontend_framework: Next.js 14 app router, Tailwind, Recharts, Framer Motion
  backend_framework: FastAPI + uvicorn, Supabase, Azure OpenAI
  package_manager: pnpm (frontend), pip (backend)
  test_framework: vitest (frontend), pytest (backend)
  repo_root: apps/web (frontend), apps/api (backend), packages/llm (LLM providers)
  style: >
    TypeScript: functional components, hooks, no classes.
    Python: async/await throughout, Pydantic models for validation.
    All mock data gated on QUORUM_TEST_MODE=true (backend) or
    NEXT_PUBLIC_QUORUM_TEST_MODE=true (frontend) — zero mocks in production.
  critical_env_vars:
    - AZURE_OPENAI_KEY (NOT AZURE_OPENAI_API_KEY)
    - AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT
    - SUPABASE_URL / NEXT_PUBLIC_SUPABASE_URL
    - SUPABASE_ANON_KEY / NEXT_PUBLIC_SUPABASE_ANON_KEY
    - NEXT_PUBLIC_QUORUM_TEST_MODE=false (production)
    - NEXT_PUBLIC_AVATAR_MOCK=false (production)

phases:

  - id: voice
    name: Voice Input — Always-On Mode
    description: Ambient listening with noise threshold; dual mic buttons on station page

    items:
      - id: "1.1"
        title: Build useAmbientVoice hook
        tags: [frontend, voice]
        priority: high
        acceptance: |
          - apps/web/src/hooks/useAmbientVoice.ts exports:
            - useAmbientVoice(opts): { active, listening, volume, start, stop, error }
          - opts: { onTranscript, noiseThreshold=20, silenceMs=1500, lang="en-US" }
          - Web Audio API for volume detection; Web Speech API continuous=true for transcript
          - Only transcribes when volume > noiseThreshold
          - Pauses recognition during silence (silenceMs), resumes for next utterance
          - Returns error string if Web Speech API unsupported (no alert)
          - Unit tests: mock AudioContext + SpeechRecognition, verify threshold + cleanup

      - id: "1.2"
        title: Add always-on mic button to station page
        tags: [frontend, voice]
        priority: high
        depends_on: ["1.1"]
        acceptance: |
          - Two mic buttons on station contribution input:
            1. Existing press-to-talk (one-shot, unchanged)
            2. New toggle: "🎙️ Live" — activates ambient mode
          - While ambient mode active: green pulsing border on textarea, volume bar below
          - Transcripts fill textarea as interim (italic), committed on silence
          - User still manually submits (never auto-submit)
          - URL param ?voiceThreshold=N (0-100) overrides default (20)
          - Both buttons disabled with tooltip if Web Speech API unsupported
          - Vitest tests for render, state transitions, error states

      - id: "1.3"
        title: Document voice modes in SETUP.md
        tags: [docs, voice]
        priority: medium
        depends_on: ["1.2"]
        acceptance: |
          - docs/SETUP.md "Voice Input Modes" section:
            - Table: press-to-talk vs always-on
            - ?voiceThreshold=N param for expo testing
            - Recommendation: press-to-talk for noisy rooms; always-on for quiet
            - Note: ThinkPad built-in mic is mono — always-on still works;
              USB webcam stereo mic needed for avatar head-turn (StereoAnalyzer)

  - id: db_migration
    name: Backend DatabaseProvider Migration
    description: Resolve routes.py TODO — wire all DB ops through DatabaseProvider ABC

    items:
      - id: "2.1"
        title: Audit raw Supabase calls in routes.py
        tags: [backend, api]
        priority: high
        acceptance: |
          - Enumerate all direct supabase.table(...) calls in routes.py
          - Map each to existing DatabaseProvider method or flag as gap
          - Audit output as inline comments or doc block — no code changes yet

      - id: "2.2"
        title: Fill DatabaseProvider gaps
        tags: [backend]
        priority: high
        depends_on: ["2.1"]
        acceptance: |
          - Any methods missing from 2.1 audit added to base.py ABC
          - Both SupabaseDatabaseProvider and PostgresDatabaseProvider implement them
          - Existing pytest tests still pass; new tests for new methods

      - id: "2.3"
        title: Migrate routes.py to DatabaseProvider
        tags: [backend, api]
        priority: high
        depends_on: ["2.2"]
        acceptance: |
          - Line 23 TODO in routes.py resolved
          - All raw supabase.table() calls replaced with db_provider.method()
          - No behavior changes; all 78 pytest tests pass
          - Integration tested against real Supabase

  - id: runtime_modes
    name: Runtime Modes — LLM + A2A Wiring
    description: Merge unmerged runtime branches; wire LLM_PROVIDER and A2A_BACKEND toggles

    items:
      - id: "3.1"
        title: Merge runtime/track-x (LLM abstraction) to main
        tags: [backend, config]
        priority: high
        acceptance: |
          - runtime/track-x merged, no conflicts
          - LLM_PROVIDER=azure|local|openai env var toggles provider
          - Local mode: Ollama (llama3.3, deepseek-r1, mistral, qwen2.5, gemma3)
          - azure.py patch (max_completion_tokens, skip temperature for gpt-5*) preserved
          - All pytest tests pass; docs/SETUP.md Ollama section added

      - id: "3.2"
        title: Merge runtime/track-y (A2A backend) to main
        tags: [backend, api]
        priority: medium
        depends_on: ["3.1"]
        acceptance: |
          - runtime/track-y merged, no conflicts
          - A2A_BACKEND=supabase|a2a env var toggles coordination backend
          - All 30 A2A tests from track-y pass on main
          - ARCHITECTURE.md updated with A2A backend section

      - id: "3.3"
        title: Expose runtime mode in /health endpoint
        tags: [backend, api]
        priority: low
        depends_on: ["3.1", "3.2"]
        acceptance: |
          - GET /health includes: llm_provider, coordination_backend, llm_model
          - Useful for verifying config at expo without reading .env

  - id: avatar
    name: Avatar — ElevenLabs Wiring + Track Z
    description: Complete avatar integration; verify all 6 transitions; ElevenLabs config

    items:
      - id: "4.1"
        title: Audit and merge runtime/track-z
        tags: [frontend, avatar]
        priority: medium
        acceptance: |
          - Review track-z commits vs main; merge non-duplicate changes
          - All 6 transitions verified: idle↔engaged, idle↔speaking, engaged↔speaking
          - AVATAR_TRANSITION_TEST=true still cycles all 6 transitions
          - All avatar tests pass

      - id: "4.2"
        title: Document ElevenLabs production setup
        tags: [docs, avatar, config]
        priority: high
        acceptance: |
          - docs/SETUP.md "7c. ElevenLabs" section:
            - Sign up → create Conversational AI agent → get API key + agent ID
            - ELEVENLABS_API_KEY, ELEVENLABS_AGENT_ID env vars
            - AVATAR_PROVIDER=elevenlabs to activate
            - Fallback: NEXT_PUBLIC_AVATAR_MOCK=true for demo without keys
            - Recommended persona: clinical facilitator, neutral professional voice
          - example.env updated with ELEVENLABS_* vars
        notes: >
          Sage creates the ElevenLabs account; this item scaffolds the config
          so dropping in the keys is all that's needed.

      - id: "4.3"
        title: Wire avatar to synthesis/conflict updates
        tags: [frontend, avatar]
        priority: low
        depends_on: ["4.1"]
        acceptance: |
          - AvatarPanel.tsx line 60 TODO resolved
          - Avatar speaks new artifact/synthesis when WebSocket quorum event fires
          - Graceful fallback: text display only if ElevenLabs not configured
          - Vitest test: mock WS event → avatar transitions to speaking state

  - id: expo_hardening
    name: Expo Hardening
    description: Resilience, UX polish, and day-of logistics for 5-station live demo

    items:
      - id: "5.1"
        title: Station page offline/reconnect handling
        tags: [frontend, realtime]
        priority: high
        acceptance: |
          - API unreachable on load: "Connecting…" banner, retry every 5s, resume on reconnect
          - Supabase realtime drops: subtle "Reconnecting…" indicator, auto-resume
          - Contribution submitted while offline: queue in sessionStorage, flush on reconnect,
            show "Queued — will submit when reconnected" badge
          - Tests: mock network failure at load, mid-session, submission; verify recovery

      - id: "5.2"
        title: Display page crash recovery and empty-state
        tags: [frontend, realtime]
        priority: high
        acceptance: |
          - Error boundary: chart crash → "Reconnecting…" slide (not white screen)
          - Empty quorumIds (event not started): "Waiting for event to begin…" placeholder
          - Supabase WS drop: charts freeze on last known state, auto-reconnect
          - Tests: error boundary catch, empty quorumIds, WS disconnect

      - id: "5.3"
        title: Expo quorum seed/reset script
        tags: [backend, config]
        priority: high
        acceptance: |
          - scripts/seed-expo-quorum.sh (or .py):
            - Creates or resets "Phase III Trial Safety Review" quorum for duke-expo-2026
            - Seeds 5–8 contributions across all defined roles (produces health ~75+)
            - Idempotent: running twice doesn't duplicate
          - Documented in docs/SETUP.md "Expo Day Checklist"

      - id: "5.4"
        title: Expo Day Checklist in SETUP.md
        tags: [docs, config]
        priority: high
        acceptance: |
          - docs/SETUP.md "Expo Day Checklist" section (fits on one printed page):
            - Pre-event verification steps (API, Supabase, display page, station page)
            - Seed/reset quorum for each workshop session
            - QR codes per station (?station=1 through ?station=5)
            - Voice mode recommendation (press-to-talk vs always-on by room noise)
            - USB webcam check for avatar head-turn
            - Offline contingency: QUORUM_TEST_MODE=true

      - id: "5.5"
        title: QR code generation script
        tags: [config]
        priority: medium
        acceptance: |
          - scripts/generate-qr.py outputs 6 PNGs to /tmp/quorum-qr/:
            - Stations 1–5: /event/duke-expo-2026/quorum/<ID>?station=N
            - Display: /display/duke-expo-2026
          - Takes HOST as argument (default: localhost:3000)
          - README note: print + tape to laptops before doors open

  - id: local_realtime
    name: Local-Mode Realtime — QR Multi-Device Demos Without Supabase
    description: >
      Enable airgapped/no-internet demos where multiple phones scan QR codes and see
      contributions propagate live across stations in --local mode (SQLite + MockLLM,
      no Supabase Realtime). Today dataProvider.ts has only two paths: DemoEngine
      (in-memory, single tab) and Supabase Realtime (.subscribe channels). --local mode
      has a network-reachable FastAPI but no broadcast layer, so multi-device views
      don't sync. Also addresses dynamic LAN IPs that break pre-printed QR codes.

    items:
      - id: "8.1"
        title: Polling fallback in dataProvider for --local mode
        tags: [frontend, realtime, infra]
        priority: medium
        acceptance: |
          - apps/web/src/lib/dataProvider.ts gains a third path activated when:
            - NEXT_PUBLIC_QUORUM_TEST_MODE is not "true" AND
            - NEXT_PUBLIC_SUPABASE_URL is missing/empty OR
              NEXT_PUBLIC_REALTIME_MODE=polling is set explicitly
          - subscribeToHealth, subscribeToContributions, subscribeToArtifact each
            poll the FastAPI backend on a configurable interval (default 1500ms,
            override via NEXT_PUBLIC_POLL_INTERVAL_MS)
          - Polling functions return an unsubscribe() that clears the interval
          - Diff-aware: only fire callback when payload changes (deep-equal or
            updated_at/version compare) to avoid re-render storms
          - Backoff on transport error (2x up to 10s) then resume on success
          - Vitest tests: mock fetch, verify interval, change detection, cleanup
          - Manual verification: 3 devices on same LAN see new contributions
            within ~2s of submission

      - id: "8.2"
        title: FastAPI WebSocket broadcast endpoint (alternative to polling)
        tags: [backend, realtime, api]
        priority: medium
        depends_on: ["8.1"]
        acceptance: |
          - apps/api gains /ws/quorum/{quorum_id} WebSocket endpoint
          - In-memory connection manager fans out events on:
            - new contribution (POST /contributions)
            - health recompute
            - artifact resolve (POST /quorums/{id}/resolve)
          - Event envelope: { type, quorum_id, payload, ts }
          - dataProvider.ts subscribe* functions prefer WebSocket when
            NEXT_PUBLIC_REALTIME_MODE=ws (or auto-detected via /api/lan-info),
            fall back to polling (8.1) if WS connect fails
          - Heartbeat ping every 30s; auto-reconnect with exponential backoff
          - pytest: connect, publish, receive across 2 clients; disconnect cleanup
          - Sub-2-second propagation across 3+ devices on same LAN

      - id: "8.3"
        title: LAN-aware QR generation with dynamic IP handling
        tags: [backend, frontend, infra, demo]
        priority: medium
        acceptance: |
          - Backend helper apps/api/utils/lan.py: detect primary LAN IPv4
            (skip loopback/docker/VPN interfaces); expose via GET /api/lan-info
            returning { lan_ip, hostname, mdns_name, port_web, port_api }
          - scripts/start.sh --local prints LAN URL banner at startup:
            "Stations reachable at http://<lan-ip>:3000 — also try http://quorum.local:3000"
          - mDNS advertisement: Bonjour/Avahi broadcast of quorum.local pointing
            at LAN IP (use zeroconf python lib; document fallback if blocked)
          - Server-side QR generation: GET /api/qr?station=N&slug=<event>
            returns PNG with URL embedding current LAN IP, regenerated per
            request so dynamic IP changes don't require reprint
          - UI affordance on /architect and /event/[slug]: "Show QR for station N"
            button opens modal with scannable QR + plain-text URL fallback
          - Graceful degradation: if devices are on different subnets / VLANs,
            show diagnostic ("device on 192.168.1.x, laptop on 10.0.0.x — connect
            to same WiFi") instead of silent failure
          - docs/SETUP.md "Airgapped Demo Mode" section with troubleshooting
          - Manual verification: scan QR from 3+ phones on same LAN, all load
            station page; works after laptop reconnects to a different network
            without regenerating QR (mDNS path) or with one regeneration (IP path)

  - id: pydantic_migration
    name: Pydantic AI Migration — Replace Custom LLMProvider, Add Real Agents (Post-Expo)
    description: >
      Replace packages/llm/quorum_llm/ custom ABC + adapters with Pydantic AI.
      Goal: stop maintaining provider adapters, get typed agents + tool calling for free,
      keep multi-provider support (Azure for Duke / OpenAI for colleagues / Anthropic / Ollama).
      Adds real agent behavior to tier 2/3 LLM stages and a facilitator agent with tools.
      Conversation history persists to Supabase (new table) so each role sees evolving context
      across turns without resending the full chat every call.

    items:
      - id: "9.1"
        title: Swap LLMProvider adapters to Pydantic AI
        tags: [backend, llm, infra]
        priority: medium
        acceptance: |
          - packages/llm/quorum_llm/interface.py LLMProvider ABC kept at surface for
            backward compatibility; bodies of providers/{azure,openai,anthropic,local}.py
            re-implemented as thin wrappers around Pydantic AI Agent + model strings
            (e.g. "azure:gpt-4o", "anthropic:claude-sonnet-4-6", "openai:gpt-4o").
          - factory.py:get_llm_provider() unchanged at the call-site level.
          - MockLLMProvider keeps its current behavior (QUORUM_TEST_MODE short-circuit).
          - Per-provider parameter quirks (max_tokens vs max_completion_tokens,
            reasoning-model temperature restrictions) handled inside Pydantic AI / shim.
          - Existing pytest suite in packages/llm/tests/ stays green; no regressions in
            Tier 1/2/3 call sites.
          - ARCHITECTURE.md + DECISIONS.md note: why we migrated, why we kept the ABC.

      - id: "9.2"
        title: Add Supabase conversation-history table + read/write helpers
        tags: [backend, db, realtime]
        priority: medium
        depends_on: ["9.1"]
        acceptance: |
          - supabase/migrations/ adds conversations table:
              id uuid pk, quorum_id uuid fk, role_id uuid fk nullable,
              agent_kind text (one of: facilitator, tier2_conflict, tier3_synthesis, role_a2a),
              messages jsonb (Pydantic AI MessageHistory serialized form),
              token_count int, model text, created_at, updated_at, version int
          - Optimistic locking on version (CAS) matching the artifacts pattern.
          - apps/api adds load_history(quorum_id, agent_kind, role_id?) and
            save_history(...) helpers in apps/api/services/conversation_store.py.
          - RLS policies: roles can only read their own conversation rows; service role
            can read all (for tier 3 synthesis).
          - Frontend dataProvider.ts gains subscribeToConversation(quorum_id, agent_kind)
            for live transcript views.
          - Integration test: a tier 2 conflict call loads + saves history, second call
            sees the prior turn without resending full chat from the caller.

      - id: "9.3"
        title: Convert Tier 2 and Tier 3 to typed Pydantic AI agents
        tags: [backend, llm]
        priority: medium
        depends_on: ["9.1", "9.2"]
        acceptance: |
          - packages/llm/quorum_llm/tier2.py rewritten as a Pydantic AI Agent with:
              - input: ContributionPair (two contributions to compare)
              - output: ConflictAssessment (Pydantic model: conflict_score float,
                conflicting_fields list[str], explanation str, recommendation enum)
              - structured output validated by Pydantic; no JSON-parsing glue code.
          - packages/llm/quorum_llm/tier3.py rewritten as a Pydantic AI Agent with:
              - input: QuorumSnapshot (contributions + roles + health history)
              - output: ArtifactSynthesis (final structured artifact matching
                existing artifacts table schema)
              - message_history loaded from conversation table per 9.2 so subsequent
                refreshes of the artifact see prior synthesis attempts.
          - Tier 1 (keyword extraction) stays deterministic Python — not converted.
          - Cost reporting per call (token in/out) wired to existing tier-cost telemetry.
          - Backward-compat shim: legacy callers in apps/api still get the old return
            shape via .dict() conversion. Removed in 9.4 cleanup phase.

      - id: "9.4"
        title: Facilitator agent prototype with tools
        tags: [backend, llm, avatar]
        priority: medium
        depends_on: ["9.2", "9.3"]
        acceptance: |
          - packages/llm/quorum_llm/agents/facilitator.py defines FacilitatorAgent
            (Pydantic AI) with tools:
              - summarize_contributions(quorum_id) -> str
              - flag_conflict(role_a_id, role_b_id, fields list[str]) -> str
              - request_clarification(role_id, topic str) -> str
              - get_health_history(quorum_id, window_minutes int) -> list[float]
          - Tools are real Python functions wrapping existing apps/api endpoints
            (or direct Supabase queries through service_role) — not stubbed.
          - System prompt sourced from the resolved archetype (medical / ethics /
            researcher) so the facilitator voice matches the avatar archetype.
          - apps/web/src/components/avatar/ wires AvatarPanel to consume facilitator
            synthesis output via a new subscribeToFacilitator() in dataProvider.ts,
            replacing the current staticSynthesisText TODO at AvatarPanel.tsx:63-64.
          - End-to-end test: seed clinical-trial.json, run 3 contributions, verify
            facilitator calls flag_conflict at least once and TTS speaks the result.
          - Cost budget: facilitator agent runs ≤ once every 30s per quorum (rate-limited).
          - Demo script update: docs/AVATAR.md describes the new behavior.

  - id: stt_provider
    name: STT Provider Abstraction (Post-Expo)
    description: Pluggable STT backend for future voice pipeline; Deepgram + AssemblyAI options

    items:
      - id: "6.1"
        title: Define STTProvider ABC
        tags: [backend, voice]
        priority: low
        acceptance: |
          - packages/stt/ with quorum_stt/providers/base.py:
            - STTProvider ABC: transcribe(audio_bytes) -> str
            - WebSpeechProvider stub (browser-side, no-op on server)
            - DeepgramProvider (Nova-3, real-time streaming)
            - AssemblyAIProvider (Universal-3 Pro, turn-queue for multi-speaker)
            - STT_PROVIDER=webspeech|deepgram|assemblyai env var
          - ARCHITECTURE.md note: ElevenLabs Scribe V2 NOT recommended for STT
            (22.1% missed entity rate per Mar 2026 benchmark; use Deepgram or AssemblyAI)
          - Unit tests for provider selection

      - id: "6.2"
        title: Wire STTProvider to station voice input
        tags: [frontend, backend, voice]
        priority: low
        depends_on: ["6.1"]
        acceptance: |
          - Station voice mode can use server-side STT via WebSocket when STT_PROVIDER != webspeech
          - Falls back to Web Speech API if server STT unavailable
          - Integration test: mock Deepgram WS → verify transcript delivery

  - id: tests
    name: Test Coverage — Keep Green, Add for New Features
    description: Target 160+ frontend (Vitest) + 100+ backend (pytest)

    items:
      - id: "7.1"
        title: Voice hook + station page tests
        tags: [tests, frontend, voice]
        priority: high
        depends_on: ["1.1", "1.2"]
        acceptance: |
          - useAmbientVoice: threshold, silence, cleanup
          - Station: both buttons render, state transitions, error states
          - All existing 131 frontend tests still pass

      - id: "7.2"
        title: DatabaseProvider migration tests
        tags: [tests, backend]
        priority: high
        depends_on: ["2.3"]
        acceptance: |
          - Tests for all migrated routes; all 78 existing pytest tests pass

      - id: "7.3"
        title: Expo hardening tests
        tags: [tests, frontend]
        priority: medium
        depends_on: ["5.1", "5.2"]
        acceptance: |
          - Station offline queue: mock failure → queue → reconnect → flush
          - Display error boundary: chart throw → recovery slide
          - Empty quorumIds: placeholder rendered
