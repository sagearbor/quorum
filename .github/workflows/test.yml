name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-tests:
    name: LLM package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/llm/pyproject.toml

      - name: Install LLM package (with dev extras)
        run: python -m pip install -e "packages/llm[dev]"

      - name: Run LLM tests
        run: python -m pytest packages/llm/tests/ -v --tb=short

  backend-tests:
    name: Backend (apps/api) tests
    runs-on: ubuntu-latest
    env:
      QUORUM_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            packages/llm/pyproject.toml

      - name: Install LLM package with dev extras (brings pytest)
        run: python -m pip install -e "packages/llm[dev]"

      - name: Install API requirements
        run: python -m pip install -r apps/api/requirements.txt

      - name: Run backend tests
        working-directory: apps/api
        run: python -m pytest tests/ -v --tb=short

  frontend-tests:
    name: Frontend (apps/web) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter web test
